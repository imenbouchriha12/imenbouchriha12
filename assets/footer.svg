<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Made with curiosity, caffeine and code">
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="50%" stop-color="#0a0818"/>
      <stop offset="100%" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#ff6ec7" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#9d7bff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <animate attributeName="x1" values="0;0.15;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.15;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="footGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="150" fill="url(#footBg)"/>
  <ellipse cx="600" cy="150" rx="480" ry="110" fill="url(#footGlow)"/>

  <path d="M0 42 C 180 8, 330 74, 600 42 S 1020 6, 1200 40 L 1200 0 L 0 0 Z" fill="url(#footBg)" opacity="0"/>
  <path d="M0 44 C 180 10, 330 76, 600 44 S 1020 8, 1200 42" fill="none" stroke="url(#wave)" stroke-width="1.6"/>

  <text x="600" y="88" text-anchor="middle" font-family="Consolas, Menlo, Monaco, monospace" font-size="11" letter-spacing="4" fill="#94a3b8">MADE WITH CURIOSITY, CAFFEINE &amp; CODE</text>
  <text x="600" y="114" text-anchor="middle" font-family="Consolas, Menlo, Monaco, monospace" font-size="9" letter-spacing="3" fill="#6b7280">IMEN BOUCHRIHA · SOFTWARE ENGINEER</text>

  <path transform="translate(600 134) scale(0.35)" fill="#ffffff" opacity="0.5" d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z"/>
  <line x1="520" y1="134" x2="580" y2="134" stroke="#334155" stroke-width="1"/>
  <line x1="620" y1="134" x2="680" y2="134" stroke="#334155" stroke-width="1"/>
</svg>

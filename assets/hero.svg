<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Imen Bouchriha — Software Engineer, Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="55%" stop-color="#0a0818"/>
      <stop offset="100%" stop-color="#120a24"/>
    </linearGradient>
    <radialGradient id="auroraPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#ff4fd8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#7c5cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffd9f4"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
      <animate attributeName="x1" values="0;0.25;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.25;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6ec7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9d7bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shootGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="textGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="430" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#grid)" mask="url(#gridMask)"/>

  <ellipse cx="150" cy="80" rx="430" ry="250" fill="url(#auroraPink)">
    <animate attributeName="cx" values="150;230;150" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;120;80" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1080" cy="120" rx="460" ry="260" fill="url(#auroraCyan)">
    <animate attributeName="cx" values="1080;990;1080" dur="24s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;70;120" dur="19s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="450" rx="580" ry="230" fill="url(#auroraViolet)">
    <animate attributeName="cx" values="600;660;600" dur="28s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="none" stroke="url(#orbitGrad)" stroke-width="1">
    <ellipse cx="600" cy="225" rx="520" ry="128" transform="rotate(-13 600 225)"/>
    <ellipse cx="600" cy="225" rx="430" ry="178" transform="rotate(10 600 225)" stroke-opacity="0.5"/>
  </g>

  <g fill="#ffffff">
    <circle cx="90" cy="250" r="1.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="70" r="1.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="268" cy="330" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="150" r="1.4"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="405" cy="55" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="365" r="1.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="95" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="6.1s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="380" r="1.3"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="60" r="1.2"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="345" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="120" r="1.7"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="290" r="1.1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="965" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6.4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="350" r="1.5"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="230" r="1"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="1165" cy="140" r="1.2"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="380" r="1"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="220" r="1.8"><animate attributeName="opacity" values="0.85;0.15;0.85" dur="5.9s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="260" r="1"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="6.7s" repeatCount="indefinite"/></circle>
    <circle cx="545" cy="205" r="1.2"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="180" r="1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="240" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="195" r="1.1"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6.2s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="175" r="1.6"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.7s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#ffffff" opacity="0.75">
    <path transform="translate(300 120) scale(0.8)" d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(880 320) scale(0.6)" d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.7s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(1080 250) scale(0.45)" d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z">
      <animate attributeName="opacity" values="0.6;0.05;0.6" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <line x1="0" y1="0" x2="95" y2="38" stroke="url(#shootGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="95" cy="38" r="1.8" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" values="-160 40; 1360 430" dur="10s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.06;0.8;1" dur="10s" begin="2s" repeatCount="indefinite"/>
  </g>

  <text x="600" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="10" fill="url(#nameGrad)" filter="url(#textGlow)">IMEN BOUCHRIHA</text>
  <text x="600" y="244" text-anchor="middle" font-family="Consolas, Menlo, Monaco, monospace" font-size="15" letter-spacing="5" fill="#c4b5fd">SOFTWARE ENGINEER · FULL-STACK DEVELOPER</text>

  <line x1="510" y1="278" x2="690" y2="278" stroke="url(#dividerGrad)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="x1" values="510;480;510" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="690;720;690" dur="7s" repeatCount="indefinite"/>
  </line>

  <text x="600" y="312" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#94a3b8">turning complex systems into interfaces that feel like magic</text>

  <g font-family="Consolas, Menlo, Monaco, monospace" font-size="10" letter-spacing="2" fill="#64748b">
    <circle cx="40" cy="37" r="3" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="41">SYS.ONLINE</text>
    <text x="1160" y="41" text-anchor="end">EST. 2023</text>
    <text x="40" y="402">DESIGN × CODE × CURIOSITY</text>
    <text x="1160" y="402" text-anchor="end">AURORA / 01</text>
  </g>
</svg>

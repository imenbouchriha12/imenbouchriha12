    <circle cx="1236" cy="326" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="5.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="842" y1="118" x2="842" y2="446" stroke="url(#rule)" stroke-width="1" opacity="0.45"/>

  <g font-family="Consolas, Menlo, Monaco, monospace">
    <text x="76" y="48" font-size="14" letter-spacing="3" fill="#9fb0c9">IMEN BOUCHRIHA</text>
    <line x1="256" y1="43" x2="284" y2="43" stroke="#3b4560" stroke-width="1"/>
    <text x="300" y="48" font-size="13" letter-spacing="3" fill="#5f6d85">PORTFOLIO / 2026</text>
    <g transform="translate(1136 30)">
      <rect width="228" height="34" rx="17" fill="#0a0e18" fill-opacity="0.8" stroke="#22d3ee" stroke-opacity="0.22"/>
      <circle cx="18" cy="17" r="3.6" fill="#34d399">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="22" font-size="12" letter-spacing="1.6" fill="#9fb0c9">OPEN TO COLLABORATIONS</text>
    </g>
    <line x1="76" y1="64" x2="1364" y2="64" stroke="url(#rule)" stroke-width="1" opacity="0.4"/>
  </g>

  <g>
    <rect x="76" y="96" width="3" height="60" fill="url(#outlineGrad)"/>
    <text x="96" y="116" font-family="Consolas, Menlo, Monaco, monospace" font-size="17" letter-spacing="3.5" fill="#ff8ad4">SOFTWARE ENGINEER</text>
    <text x="96" y="144" font-family="Consolas, Menlo, Monaco, monospace" font-size="13" letter-spacing="2.6" fill="#6f7f98">FULL-STACK · REAL-TIME · DESIGN-MINDED</text>
  </g>

  <text x="72" y="272" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="2" fill="url(#nameGrad)" filter="url(#titleGlow)">IMEN</text>
  <text x="72" y="358" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="12" fill="#9d7bff" fill-opacity="0.06" stroke="url(#outlineGrad)" stroke-width="1.6">BOUCHRIHA</text>

  <path transform="translate(652 182) scale(0.85)" d="M0 -11 L2.2 -2.2 L11 0 L2.2 2.2 L0 11 L-2.2 2.2 L-11 0 L-2.2 -2.2 Z" fill="#ff6ec7">
    <animate attributeName="opacity" values="0.9;0.25;0.9" dur="4.6s" repeatCount="indefinite"/>
  </path>

  <text x="96" y="414" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#cbd5e1">I design and build real-time products that feel alive.</text>
  <text x="96" y="446" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#7f8ea3">clean architecture · expressive interfaces · obsessive detail</text>

  <g>
    <rect x="960" y="332" width="400" height="110" rx="18" fill="#0a0e18" fill-opacity="0.88" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <rect x="960" y="332" width="400" height="110" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    <text x="986" y="364" font-family="Consolas, Menlo, Monaco, monospace" font-size="13" letter-spacing="2.6" fill="#ff8ad4">NOW BUILDING</text>
    <text x="986" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" fill="#eef4fb">BT DocCenter</text>
    <text x="986" y="425" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8fa0b8">real-time fintech · OCR · SignalR</text>
    <g transform="translate(1236 352)">
      <circle cx="0" cy="0" r="3.4" fill="#ff6ec7">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="100" y="4" text-anchor="end" font-family="Consolas, Menlo, Monaco, monospace" font-size="11" letter-spacing="1.4" fill="#7f8ea3">IN PROGRESS</text>
    </g>
  </g>

  <g fill="#ffffff">
    <circle cx="60" cy="220" r="1.2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="300" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="170" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="360" r="1.3"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="120" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="330" r="1.4"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="110" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="6.1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="300" r="1.5"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="1.1"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="200" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="70" r="1.6"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="1370" cy="250" r="1.2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="480" r="1.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6.4s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="430" r="1.1"><animate attributeName="opacity" values="0.9;0.15;0.9" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="60" r="1.2"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="470" r="1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <line x1="0" y1="0" x2="82" y2="34" stroke="url(#shootGrad)" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="82" cy="34" r="1.6" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" values="-140 30; 1560 610" dur="11s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.06;0.8;1" dur="11s" begin="3s" repeatCount="indefinite"/>
  </g>

  <line x1="76" y1="476" x2="1364" y2="476" stroke="url(#rule)" stroke-width="1" opacity="0.45"/>
  <g font-family="Consolas, Menlo, Monaco, monospace" font-size="14" letter-spacing="2.2" fill="#64748b">
    <text x="76" y="502">DESIGN × CODE × CURIOSITY</text>
    <text x="1364" y="502" text-anchor="end">AURORA / 2026</text>
  </g>

  <rect x="0" y="517" width="1440" height="3" fill="url(#edgeGrad)" opacity="0.9"/>
</svg>

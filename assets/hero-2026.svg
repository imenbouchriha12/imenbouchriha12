  <rect x="0" y="379" width="1440" height="1.5" fill="url(#rule)" opacity="0.35"/>

  <g stroke="#9d7bff" stroke-opacity="0.16" fill="none">
    <circle cx="1160" cy="212" r="152"/>
    <circle cx="1160" cy="212" r="114"/>
  </g>
  <g fill="none" stroke="#ff6ec7" stroke-opacity="0.34">
    <ellipse cx="1160" cy="212" rx="192" ry="66" transform="rotate(-18 1160 212)">
      <animateTransform attributeName="transform" type="rotate" values="-18 1160 212;342 1160 212" dur="46s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1160" cy="212" rx="164" ry="132" transform="rotate(24 1160 212)" stroke="#9d7bff" stroke-opacity="0.22">
      <animateTransform attributeName="transform" type="rotate" values="24 1160 212;384 1160 212" dur="60s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <circle cx="1160" cy="212" r="90" fill="url(#orb)" filter="url(#orbGlow)">
    <animate attributeName="r" values="90;94;90" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1160" cy="212" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <g>

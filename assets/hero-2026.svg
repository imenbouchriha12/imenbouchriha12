<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="Imen Bouchriha — software engineer. I design and build real-time products that feel alive.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0a0718"/>
      <stop offset="1" stop-color="#150b2c"/>
    </linearGradient>
    <radialGradient id="auroraPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#ff4fd8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#7c5cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6f9"/>
      <stop offset="28%" stop-color="#ff6ec7"/>
      <stop offset="62%" stop-color="#7c5cff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffd9f4"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
      <animate attributeName="x1" values="0;0.22;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.22;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="outlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#9d7bff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ff6ec7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#9d7bff" stop-opacity="0.55"/>
      <stop offset="82%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#9d7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff6ec7"/>
      <stop offset="70%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shootGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <filter id="titleGlow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orbGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="floorClip"><rect x="0" y="380" width="1440" height="140"/></clipPath>
    <mask id="floorMask">
      <rect x="0" y="380" width="1440" height="140" fill="url(#floorFade)"/>
    </mask>
  </defs>

  <rect width="1440" height="520" fill="url(#bg)"/>
  <rect width="1440" height="520" fill="url(#dots)" opacity="0.55"/>

  <ellipse cx="210" cy="80" rx="520" ry="280" fill="url(#auroraPink)">
    <animate attributeName="cx" values="210;290;210" dur="21s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;130;80" dur="27s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1330" cy="100" rx="470" ry="300" fill="url(#auroraCyan)">
    <animate attributeName="cx" values="1330;1240;1330" dur="25s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;60;100" dur="19s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="760" cy="560" rx="660" ry="260" fill="url(#auroraViolet)">
    <animate attributeName="cx" values="760;820;760" dur="29s" repeatCount="indefinite"/>
  </ellipse>

  <g clip-path="url(#floorClip)" mask="url(#floorMask)" stroke="#8fa3c8" stroke-width="1" opacity="0.16">
    <line x1="720" y1="380" x2="-560" y2="520"/>
    <line x1="720" y1="380" x2="-400" y2="520"/>
    <line x1="720" y1="380" x2="-240" y2="520"/>
    <line x1="720" y1="380" x2="-80" y2="520"/>
    <line x1="720" y1="380" x2="80" y2="520"/>
    <line x1="720" y1="380" x2="240" y2="520"/>
    <line x1="720" y1="380" x2="400" y2="520"/>
    <line x1="720" y1="380" x2="560" y2="520"/>
    <line x1="720" y1="380" x2="720" y2="520"/>
    <line x1="720" y1="380" x2="880" y2="520"/>
    <line x1="720" y1="380" x2="1040" y2="520"/>
    <line x1="720" y1="380" x2="1200" y2="520"/>
    <line x1="720" y1="380" x2="1360" y2="520"/>
    <line x1="720" y1="380" x2="1520" y2="520"/>
    <line x1="720" y1="380" x2="1680" y2="520"/>
    <line x1="720" y1="380" x2="1840" y2="520"/>
    <line x1="720" y1="380" x2="2000" y2="520"/>
    <line x1="0" y1="381" x2="1440" y2="381"/>
    <line x1="0" y1="382" x2="1440" y2="382"/>
    <line x1="0" y1="385" x2="1440" y2="385"/>
    <line x1="0" y1="389" x2="1440" y2="389"/>
    <line x1="0" y1="395" x2="1440" y2="395"/>
    <line x1="0" y1="402" x2="1440" y2="402"/>
    <line x1="0" y1="411" x2="1440" y2="411"/>
    <line x1="0" y1="421" x2="1440" y2="421"/>
    <line x1="0" y1="433" x2="1440" y2="433"/>
    <line x1="0" y1="447" x2="1440" y2="447"/>
    <line x1="0" y1="463" x2="1440" y2="463"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="499" x2="1440" y2="499"/>
    <line x1="0" y1="520" x2="1440" y2="520"/>

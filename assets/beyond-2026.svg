<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="bt bd">
  <title id="bt">Beyond the code — the after-hours side</title>
  <desc id="bd">A synthwave night scene with a striped moon, stars, a perspective grid and an espresso cup, next to four pillars: design systems, dark mode, accessibility and AI × UX.</desc>

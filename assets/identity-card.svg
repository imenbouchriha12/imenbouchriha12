<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">Imen Bouchriha — signature identity card</title>
  <desc id="desc">Neon monogram card: IB monogram, name, role, a short manifesto and a handwritten signature.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111833"/>
      <stop offset="0.55" stop-color="#0A0E1E"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="auroraPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6EC7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF6EC7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9D7BFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#9D7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#05070D" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070D" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="monoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6EC7">
        <animate attributeName="stop-color" values="#FF6EC7;#9D7BFF;#22D3EE;#FF6EC7" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.48" stop-color="#C07BFF"/>
      <stop offset="1" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#FF6EC7;#9D7BFF;#22D3EE" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sigGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9DDB"/>
      <stop offset="0.5" stop-color="#C9A8FF"/>
      <stop offset="1" stop-color="#7DE8F7"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6EC7" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#9D7BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6EC7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9D7BFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6EC7" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#9D7BFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9D7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#8FA3BF" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="720" height="980" fill="url(#bg)"/>
  <rect width="720" height="980" fill="url(#dots)"/>

  <g>
    <ellipse cx="592" cy="128" rx="280" ry="200" fill="url(#auroraPink)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-26 20;6 -12;0 0" dur="19s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="104" cy="470" rx="260" ry="220" fill="url(#auroraViolet)">
      <animateTransform attributeName="transform" type="translate" values="0 0;22 -16;-10 22;0 0" dur="25s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="596" cy="878" rx="280" ry="190" fill="url(#auroraCyan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-18 -14;14 10;0 0" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g fill="#DCE6F2">
    <circle cx="120" cy="196" r="1.6" opacity="0.35"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="604" cy="236" r="1.2" opacity="0.3"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="656" cy="388" r="1.8" opacity="0.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="86" cy="622" r="1.4" opacity="0.3"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="6.1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="700" r="1.3" opacity="0.3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="146" cy="836" r="1.7" opacity="0.35"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="5.2s" repeatCount="indefinite"/></circle>
    <path d="M596 566 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#FF9DDB" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="6.4s" repeatCount="indefinite"/>
    </path>
    <path d="M148 356 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z" fill="#7DE8F7" opacity="0.4">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect width="720" height="980" fill="url(#vignette)"/>

  <rect x="10" y="10" width="700" height="960" rx="30" fill="none" stroke="#2A3346" stroke-width="1.5"/>
  <rect x="18" y="18" width="684" height="944" rx="24" fill="none" stroke="url(#edgeGrad)" stroke-width="1" opacity="0.35"/>

  <g transform="translate(44 44)">
    <rect width="200" height="40" rx="20" fill="#0A0D16" fill-opacity="0.82" stroke="#FF6EC7" stroke-opacity="0.6"/>
    <text x="19" y="26" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="2.4" fill="#FF9DDB">SIGNATURE / 01</text>
  </g>

  <g opacity="0.55">
    <circle cx="628" cy="64" r="2.4" fill="#5B6B84"/>
    <circle cx="644" cy="64" r="2.4" fill="#7B8CA6"/>
    <circle cx="660" cy="64" r="2.4" fill="#A9B8CC"/>
  </g>

  <circle cx="360" cy="264" r="148" fill="none" stroke="#9D7BFF" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3 9">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="14s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#7B8CA6" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round">
    <line x1="360" y1="98" x2="360" y2="112"/>
    <line x1="360" y1="416" x2="360" y2="430"/>
    <line x1="194" y1="264" x2="208" y2="264"/>
    <line x1="512" y1="264" x2="526" y2="264"/>
  </g>

  <ellipse cx="360" cy="264" rx="150" ry="150" fill="url(#orbGlow)" opacity="0.9">
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 360 290" to="360 360 290" dur="38s" repeatCount="indefinite"/>
    <g transform="rotate(-16 360 290)">
      <ellipse cx="360" cy="290" rx="206" ry="68" fill="none" stroke="url(#edgeGrad)" stroke-width="1.5" stroke-opacity="0.75"/>
      <circle cx="554" cy="313" r="4.2" fill="#FF6EC7">
        <animate attributeName="r" values="3.4;5;3.4" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="166" cy="267" r="3.2" fill="#7DE8F7" opacity="0.85"/>
    </g>
  </g>

  <text x="360" y="366" text-anchor="middle" font-family="'Bahnschrift SemiBold', 'Segoe UI', Arial, sans-serif" font-size="250" font-weight="800" letter-spacing="6" fill="url(#monoGrad)" filter="url(#softGlow)">IB</text>

  <text x="360" y="482" text-anchor="middle" font-family="'Bahnschrift SemiBold', 'Segoe UI Semibold', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="6" fill="#F2F6FB">IMEN BOUCHRIHA</text>
  <text x="360" y="520" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="3.2" fill="#A9B8CC">SOFTWARE ENGINEER · FULL-STACK</text>

  <line x1="180" y1="556" x2="540" y2="556" stroke="url(#lineGrad)" stroke-width="1"/>

  <text x="360" y="608" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" fill="#C4CFDD">Half engineer, half designer —</text>
  <text x="360" y="648" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" fill="#C4CFDD">always building something after midnight.</text>

  <g transform="rotate(-5 360 742)">
    <text x="360" y="762" text-anchor="middle" font-family="'Segoe Script', 'Brush Script MT', cursive" font-size="62" fill="url(#sigGrad)" fill-opacity="0.95">Imen Bouchriha</text>
  </g>
  <path d="M196 784 C 262 802, 342 798, 400 782 S 506 758, 528 772" fill="none" stroke="url(#sigGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.85" pathLength="620" stroke-dasharray="620" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="620;0" dur="2.8s" begin="0.4s" fill="freeze"/>
  </path>

  <text x="360" y="824" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="4.5" fill="#5E6F87">DESIGNED · CODED · SIGNED</text>

  <line x1="44" y1="888" x2="676" y2="888" stroke="#1E2637" stroke-width="1"/>
  <text x="44" y="924" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#7F8EA3">PORTFOLIO / 2026</text>

  <g transform="translate(524 918)">
    <circle cx="3" cy="3" r="3.2" fill="#34D399">
      <animate attributeName="r" values="2.4;4;2.4" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="8" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.8" fill="#9FB0C9">OPEN TO COLLAB</text>
  </g>

  <g stroke="#FF6EC7" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <path d="M30 52 V30 H52"/>
    <path d="M668 30 H690 V52"/>
    <path d="M30 928 V950 H52"/>
    <path d="M690 928 V950 H668"/>
  </g>

</svg>
